<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또롱이 수첩</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="또롱이 수첩">
<meta name="theme-color" content="#FFF4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1518" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<script src="config.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 엄지 한 손으로 넘기는 세로 카드 한 줄 + 아래 탭바. 쪼랭이 페이지만 밤하늘 한 장. */
:root {
  --bg: #FFF4F3;
  --surface: #FFFFFF;
  --surface-2: #FBF1EF;
  --ink: #3B2A2B;
  --ink-2: #6C5757;
  --ink-3: #9A8483;
  --line: #F2E3E1;
  --accent: #D6336A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE4EB;
  --pink: #FF8FAB;
  --butter: #FFCB45;
  --butter-ink: #4A3300;
  --butter-soft: #FFF2CC;
  --f-med: #E5484D;
  --f-pre: #1A8F5C;
  --f-wt: #D9730D;
  --f-care: #A88400;
  --f-out: #8657C9;
  --f-hl: #B4651E;
  --danger: #C8333A;
  --scrim: rgba(59, 30, 34, 0.42);
  --shadow: 0 1px 1px rgba(150, 70, 80, 0.04), 0 10px 28px rgba(214, 110, 130, 0.10);
  --night: #2A1C3E;
  --night-2: #57336F;
  --night-ink: #FBF1FF;
  --night-ink-2: #D2BEE6;
  --star: #FFD66B;
  --ear-out: #FFB3C5;
  --ear-in: #FFE3EA;
  --card-edge: rgba(255, 255, 255, 0.7);
  --font-display: 'Bagel Fat One', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
  --r: 24px;
  --r-sm: 14px;
  --tabbar-h: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1518; --surface: #281E22; --surface-2: #33272B; --ink: #F8ECEC; --ink-2: #D2C0C0; --ink-3: #A08C8C;
    --line: #3B2E32; --accent: #FF86A6; --accent-ink: #2B0914; --accent-soft: #4A2331; --pink: #FF8FAB; --butter: #F2C04E; --butter-ink: #2C1E00; --butter-soft: #3A2F14;
    --f-med: #FF7A7E; --f-pre: #4CCB92; --f-wt: #FFA552; --f-care: #E0BE3A; --f-out: #B794F2; --f-hl: #E0A06E; --danger: #FF8074;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.3);
    --night: #1E1430; --night-2: #432856; --night-ink: #FBF1FF; --night-ink-2: #C9B4DE; --star: #FFD66B;
    --ear-out: #8C4560; --ear-in: #5C2A3D; --card-edge: rgba(255, 255, 255, 0.04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1518; --surface: #281E22; --surface-2: #33272B; --ink: #F8ECEC; --ink-2: #D2C0C0; --ink-3: #A08C8C;
  --line: #3B2E32; --accent: #FF86A6; --accent-ink: #2B0914; --accent-soft: #4A2331; --pink: #FF8FAB; --butter: #F2C04E; --butter-ink: #2C1E00; --butter-soft: #3A2F14;
  --f-med: #FF7A7E; --f-pre: #4CCB92; --f-wt: #FFA552; --f-care: #E0BE3A; --f-out: #B794F2; --f-hl: #E0A06E; --danger: #FF8074;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.3);
  --night: #1E1430; --night-2: #432856; --night-ink: #FBF1FF; --night-ink-2: #C9B4DE; --star: #FFD66B;
  --ear-out: #8C4560; --ear-in: #5C2A3D; --card-edge: rgba(255, 255, 255, 0.04);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-fill { fill: currentColor; stroke: none; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 92px);
}
.view { display: flex; flex-direction: column; gap: 14px; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 2px 2px; }
.view-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
.banner { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 12px 14px; color: var(--ink-2); font-size: 14px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.card-head .sub { color: var(--ink-3); font-size: 13px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.muted { color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; }

/* hero: 등록증 같은 프로필 카드 */
.hero { padding: 18px 16px 16px; gap: 14px; }
.hero-top { display: grid; grid-template-columns: minmax(84px, 1fr) auto; gap: 16px; align-items: center; }
/* 홈 맨 위 사진: 이름 칸은 글자만큼, 남는 자리는 모두 사진으로 (너무 커지지 않게 240px까지) */
.hero-top .avatar { width: 100%; max-width: 240px; height: auto; aspect-ratio: 1 / 1; border-radius: 24px; justify-self: start; }
.hero-top .avatar .mono { font-size: 56px; }
.hero-top .avatar .cam { right: 8px; bottom: 8px; width: 30px; height: 30px; }
.hero-top .avatar .cam .ic { width: 17px; height: 17px; }
.avatar { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--butter); color: var(--butter-ink); display: grid; place-items: center; overflow: hidden; border: 0; padding: 0; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .mono { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.avatar .cam { position: absolute; right: 2px; bottom: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--ink-2); display: grid; place-items: center; box-shadow: var(--shadow); }
.avatar .cam .ic { width: 15px; height: 15px; }
.hero-name { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hero-name h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; }
.hero-name .meta { color: var(--ink-2); font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.butter { background: var(--butter); color: var(--butter-ink); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); padding-top: 12px; }
.fields div { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; border-left: 1px solid var(--line); min-width: 0; }
.fields div:first-child { border-left: 0; padding-left: 0; }
.fields dt { font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em; }
.fields dd { margin: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 359px) { .fields div { padding: 0 5px; } .fields dd { font-size: 12px; letter-spacing: -0.02em; } .fields dt { font-size: 11px; } }

/* rows */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; border-top: 1px solid var(--line); }
.list > .row:first-child { border-top: 0; }
.row-date { display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-variant-numeric: tabular-nums; }
.row-date b { font-size: 15px; font-weight: 700; }
.row-date small { font-size: 12px; color: var(--ink-3); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.row-sub { color: var(--ink-3); font-size: 13px; display: block; }
.row-sub .dot { margin-right: 6px; vertical-align: 1px; }
.row-sub .tag { margin-left: 6px; display: inline-block; vertical-align: 1px; }
.row-end { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-end.amt { font-size: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.fam-med { background: var(--f-med); } .fam-pre { background: var(--f-pre); } .fam-wt { background: var(--f-wt); }
.fam-care { background: var(--f-care); } .fam-out { background: var(--f-out); }
.tag { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
.tag.warn { background: var(--accent-soft); color: var(--accent); }
.tag.gc { background: var(--surface-2); color: var(--f-wt); }
.sync-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); padding: 0 4px; flex-wrap: wrap; }
.sync-line .dot { width: 7px; height: 7px; }
.sync-ok { background: var(--f-pre); } .sync-warn { background: var(--accent); } .sync-off { background: var(--ink-3); }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.rules b { color: var(--ink); }
.status-box { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.status-box .head { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); }
.dchip { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.dchip.soon { background: var(--butter); color: var(--butter-ink); }
.dchip.today { background: var(--accent); color: var(--accent-ink); }
.month-h { font-size: 13px; font-weight: 700; color: var(--ink-3); padding: 14px 0 2px; letter-spacing: 0.02em; }
.month-h:first-child { padding-top: 0; }

/* weight */
.big { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.big small { font-size: 18px; font-weight: 600; margin-left: 2px; }
.stat-line { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.delta { color: var(--ink-2); font-size: 14px; }
.note { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
.note b { color: var(--ink); }
.chart { position: relative; width: 100%; min-height: 170px; touch-action: pan-y; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.chart .endlbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.1; }
.chart .enddot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.chart .tgt { stroke: var(--f-pre); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .tgtl { fill: var(--f-pre); font-size: 11px; font-weight: 700; font-family: var(--font-body); }
/* 최근 30일 간식 막대, 최근 4주 약 칸 */
.trend { display: flex; flex-direction: column; gap: 8px; }
.trend-bars { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); align-items: end; gap: 2px; height: 64px; }
.trend-bars i { display: block; background: var(--f-care); border-radius: 2px 2px 0 0; min-height: 2px; opacity: 0.85; }
.trend-bars i.z { background: var(--line); opacity: 1; }
.trend-bars i.t { outline: 2px solid var(--ink); outline-offset: 1px; }
.trend-ax { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
.trend-dots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.trend-dots i { display: block; aspect-ratio: 1 / 1; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.trend-dots i.full { background: var(--f-pre); border-color: var(--f-pre); }
.trend-dots i.part { background: var(--f-pre); border-color: transparent; opacity: 0.38; }
.trend-key i.pk { background: var(--f-pre); opacity: 0.38; }
.trend-dots i.wait { background: transparent; border-style: dashed; }
.trend-dots i.miss { background: var(--accent-soft); border-color: var(--accent-soft); }
.trend-dots i.t { outline: 2px solid var(--ink); outline-offset: 1px; }
.trend-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-3); }
.trend-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.pick.bcs { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.pick.bcs button { min-width: 0; padding: 8px 0; text-align: center; }
.chart .hov { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 12px; line-height: 1.35; pointer-events: none; white-space: nowrap; text-align: center; }
.tip b { font-size: 14px; }
.night .chart .ax { fill: var(--night-ink-2); }
.night .chart .endlbl { fill: var(--night-ink); }
.night .chart .grid { stroke: rgba(255, 255, 255, 0.12); }
.night .chart .ln { stroke: var(--star); }
.night .chart .area { fill: var(--star); opacity: 0.12; }
.night .chart .enddot, .night .chart .hov { fill: var(--star); stroke: var(--night); }
.night .chart .cross { stroke: var(--night-ink-2); }
.night .tip { background: var(--night-ink); color: var(--night); }

/* money */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.bar-row .lbl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .track { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 3px; }
.bar-row .val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.bar-row.sel .lbl { color: var(--ink); font-weight: 700; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav strong { font-size: 17px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.split { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* filters */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 0 14px; border: 1px solid var(--line); }
.search input { border: 0; background: none; outline: none; padding: 11px 0; font-size: 16px; width: 100%; min-width: 0; }
.search .ic { color: var(--ink-3); width: 18px; height: 18px; }

/* info */
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.feed { display: flex; flex-direction: column; }
.feed-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; align-items: center; }
.feed-row:first-child { border-top: 0; }
.feed-row .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); }
.phone { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.phone span { user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; font-weight: 600; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { background: none; color: var(--danger); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
/* 누르는 느낌: 누르는 동안 살짝 작아지고, 저장 버튼은 한 번 톡 튀고 저장하는 동안 도는 표시 */
.btn, .icon-btn, .mchip, .med-slot, .pick button, .tile, .seg button { transition: transform 0.08s ease, filter 0.08s ease; }
.btn:active:not(:disabled), .icon-btn:active:not(:disabled), .mchip:active, .med-slot:active, .pick button:active, .tile:active, .seg button:active { transform: scale(0.95); filter: brightness(0.9); }
@keyframes btnpop { 0% { transform: scale(1); } 35% { transform: scale(0.93); } 100% { transform: scale(1); } }
.btn.pop { animation: btnpop 0.28s ease-out; }
.btn.busy { pointer-events: none; opacity: 0.8; }
.btn.busy::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; }
@media (prefers-reduced-motion: reduce) { .btn.pop { animation: none; } .btn.busy::before { animation-duration: 1.6s; } }
.btn-row .btn { flex: 1 1 auto; }

/* memorial */

/* tab bar & fab */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);

  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 2px); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }

  padding-bottom: env(safe-area-inset-bottom, 0px); }

.form { display: flex; flex-direction: column; gap: 14px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.detail { display: flex; flex-direction: column; gap: 14px; }

.block { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.9); display: grid; place-items: center; padding: max(60px, calc(env(safe-area-inset-top, 0px) + 56px)) max(16px, env(safe-area-inset-right, 0px)) max(72px, calc(env(safe-area-inset-bottom, 0px) + 68px)) max(16px, env(safe-area-inset-left, 0px)); touch-action: pan-y pinch-zoom; }

.lb-bar { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 16px; color: #fff; font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 70; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 86px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow); }

#v-meds, #medcfg-form, #med-form, .t-meds, #v-snacks, #meal-form { word-break: keep-all; overflow-wrap: anywhere; }
.t-meds.lines { flex-direction: column; align-items: flex-start; gap: 8px; }
.t-mline { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.t-mline .nm { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.t-mline .cs { display: flex; flex-wrap: wrap; gap: 6px; }
.mtbl { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 74px repeat(var(--n, 3), minmax(0, 1fr)); align-items: center; gap: 4px; width: 100%; border: 0; background: none; padding: 7px 6px; border-top: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; border-radius: 10px; color: var(--ink); }
.mrow.head { border-top: 0; padding-top: 0; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
.mrow .d { text-align: left; font-size: 14px; font-weight: 700; white-space: nowrap; }
.mrow .d small { font-size: 12px; color: var(--ink-3); font-weight: 600; margin-left: 3px; }
.mrow .c { display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-size: 14px; color: var(--ink-3); }
.mrow .c.on { color: var(--accent); font-weight: 800; }
.mrow .c small { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.mrow.sel { background: var(--surface-2); }
.mrow.today .d { color: var(--accent); }

/* 간식 체크리스트 */
.snack-list { display: flex; flex-direction: column; }
.snack-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.snack-row:first-child { border-top: 0; }
.snack-row .nm { font-size: 16px; font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .icon-btn { width: 44px; height: 44px; color: var(--ink); }
.stepper .icon-btn.plus { background: var(--accent); color: var(--accent-ink); }
.stepper .icon-btn .ic { width: 20px; height: 20px; stroke-width: 2.4; }
.stepper input { width: 58px; height: 44px; text-align: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; -webkit-appearance: none; appearance: textfield; -moz-appearance: textfield; padding: 0; }
.stepper input:focus { border-color: var(--accent); background: var(--surface); }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.snack-total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; color: var(--ink-2); }
.snack-kind { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.snack-kind .link { font-size: 13px; padding: 2px 0; }
/* 간식 종류 고치기 */
.sc-list { display: flex; flex-direction: column; gap: 8px; }
.sc-row { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.sc-top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }
.sc-top input { width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; color: var(--ink); }
.sc-top input:focus { border-color: var(--accent); }
.sc-top .icon-btn { width: 40px; height: 40px; background: var(--surface); }
.sc-top .icon-btn .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.sc-opts { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.sc-opts .check { font-size: 13.5px; gap: 7px; }
.sc-opts .check input { width: 18px; height: 18px; }
.snack-total b { font-size: 20px; color: var(--ink); }
.slog { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; color: var(--ink-2); }
.slog div { display: flex; gap: 8px; }
.slog .t { color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 62px; }
.slog .dl { font-weight: 700; font-variant-numeric: tabular-nums; }
.slog .dl.up { color: var(--accent); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -6px; }
.stbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.stbl th, .stbl td { padding: 8px 3px; text-align: center; border-top: 1px solid var(--line); white-space: nowrap; }
.stbl thead th { border-top: 0; font-size: 12.5px; color: var(--ink-3); font-weight: 700; padding-top: 0; }
.stbl th:first-child, .stbl td:first-child { text-align: left; padding-left: 6px; }
.stbl td:first-child small { color: var(--ink-3); font-size: 12px; margin-left: 2px; }
.stbl tbody tr { cursor: pointer; }
.stbl td.z { color: var(--ink-3); }
.stbl td.z span { opacity: 0.45; }
.stbl td.sum { font-weight: 800; }
.stbl tr.sel td { background: var(--surface-2); }
.stbl tr.today td:first-child { color: var(--accent); font-weight: 700; }
.stbl tfoot th { border-top: 2px solid var(--line); font-weight: 800; color: var(--ink); font-size: 14px; }

/* 오늘의 또롱이 */
.dphotos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.dphotos .ph { border-radius: 12px; }
.d-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 12px; border: 1.5px dashed var(--line); border-radius: 16px; color: var(--ink-3); text-align: center; font-size: 14px; width: 100%; background: none; }
.d-empty .ic { width: 34px; height: 34px; color: var(--ink-3); }
.d-empty b { color: var(--ink); font-size: 15px; }
.inline { display: flex; gap: 8px; align-items: stretch; }
.inline input { flex: 1 1 auto; min-width: 0; }
.inline .btn { flex: none; white-space: nowrap; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wh { font-size: 12px; color: var(--ink-3); text-align: center; font-weight: 700; padding-bottom: 2px; }
.cal .wh.sun { color: var(--danger); }
.cday { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; background: var(--surface-2); overflow: hidden; color: var(--ink-2); font-size: 12.5px; font-weight: 700; }
.cday.blank { background: none; }
.cday img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cday .n { position: absolute; left: 4px; top: 3px; line-height: 1.1; }
.cday.has .n { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75); }
.cday .cnt { position: absolute; right: 3px; bottom: 3px; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 10.5px; border-radius: 999px; padding: 0 5px; line-height: 16px; }
.cday .nt { position: absolute; left: 4px; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cday.today:not(.has) .n { color: var(--accent); }
.cday.sel::after, .cday.today::after { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none; }
.cday.today::after { box-shadow: inset 0 0 0 2px var(--accent); }
.cday.sel::after { box-shadow: inset 0 0 0 3px var(--ink); }
.cday:disabled { opacity: 0.35; cursor: default; }

/* 오늘의 또롱이: 날짜별 ↔ 사진첩 */
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1 1 0; padding: 8px 10px; font-size: 15px; }
.album { display: flex; flex-direction: column; gap: 6px; }
.ahead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 2px 0; }
.ahead:first-child { padding-top: 0; }
.ahead b { font-size: 16px; }
.ahead span { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.agrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border-radius: 14px; overflow: hidden; }
.atile { position: relative; aspect-ratio: 1; border: 0; padding: 0; margin: 0; background: var(--surface-2); overflow: hidden; display: block; width: 100%; }
.atile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s ease; }
.atile img[data-wait] { opacity: 0; }
.aday { position: absolute; left: 4px; bottom: 4px; font-size: 11px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, 0.5); border-radius: 999px; padding: 0 6px; line-height: 17px; pointer-events: none; }
.amore { display: block; width: 100%; border: 0; background: none; text-align: center; color: var(--ink-3); font-size: 13.5px; font-weight: 600; padding: 12px 0; }
button.amore { color: var(--accent); }

/* 홈: 오늘 챙기기 */
.tlist { display: flex; flex-direction: column; }
.t-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 0; text-align: left; border-top: 1px solid var(--line); color: var(--ink); min-height: 50px; }
.tlist > .t-row:first-child { border-top: 0; }
.t-lbl { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.t-val { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-val.muted { color: var(--ink-3); font-weight: 500; }
.t-end { display: flex; align-items: center; gap: 4px; color: var(--ink-3); }
.t-end .ic { width: 18px; height: 18px; }
.t-meds { display: flex; gap: 6px; flex-wrap: wrap; }
.mchip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 14px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.mchip .ic { width: 15px; height: 15px; stroke-width: 2.8; }
.mchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mchip small { font-size: 12px; font-weight: 600; opacity: 0.9; }
.t-thumbs { display: flex; gap: 4px; }
.t-thumbs img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
.t-two { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mchip.auto:not(.on) { border-style: dashed; }
.mchip.ate-none { background: var(--surface-2); border-color: var(--danger); color: var(--danger); }
.mchip.ate-some { background: var(--butter); border-color: var(--butter); color: var(--butter-ink); }
/* 끼니에 같이 주는 영양제·약: 홈 칩의 작은 표시, 밥·간식 탭 끼니 아래 칩 */
.mchip .mb { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 2px; white-space: nowrap; }
.mchip.on .mb { background: var(--surface); color: var(--accent); }
.meal-adds { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 2px 66px; }
.meal-adds .mchip { font-size: 13.5px; padding: 5px 10px; }
.mchip.add:not(.on) { border-style: dashed; }
/* 밥 먹는 시간 고치기: 끼니를 눌러서 펴고, 시간·종류·방법을 골라요 */
#feed-form { word-break: keep-all; overflow-wrap: anywhere; }
.fd-list { display: flex; flex-direction: column; gap: 8px; }
.fd-row { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); min-width: 0; }
.fd-row.open { background: var(--surface); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.fd-sum { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 11px 12px; text-align: left; color: var(--ink); font-size: 15px; border-radius: 14px; }
.fd-sum .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.fd-sum .w { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fd-sum .w small { font-size: 13px; color: var(--ink-2); }
.fd-sum .go { color: var(--ink-3); display: flex; }
.fd-sum .go .ic { width: 18px; height: 18px; }
.fd-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fd-head b { font-size: 16px; }
.fd-head .acts { display: flex; align-items: center; gap: 8px; }
.fd-time { display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr); gap: 10px; align-items: center; }
.fd-time .fd-tl { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.fd-adds { display: flex; flex-wrap: wrap; gap: 6px; }
.fd-add { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 3px 3px 3px 8px; font-size: 14px; font-weight: 600; background: var(--surface-2); }
.fd-add .tag { flex: none; }
.fd-add .icon-btn { width: 28px; height: 28px; background: var(--surface); }
.fd-add .icon-btn .ic { width: 14px; height: 14px; }
.fd-addform { display: flex; flex-direction: column; gap: 10px; border: 1px dashed var(--line); border-radius: 12px; padding: 10px; }
.pick button.more:not([aria-pressed="true"]) { border-style: dashed; color: var(--ink-3); }
.feed-row small.fadd { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; margin-top: 2px; }

/* 병원 문서 */
.doc-ic { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; color: var(--f-med); }
.doc-ic .ic { width: 15px; height: 15px; stroke-width: 2; }
.sum-one { font-size: 16px; font-weight: 700; line-height: 1.45; background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; word-break: keep-all; overflow-wrap: anywhere; }
.sum-sec { display: flex; flex-direction: column; gap: 8px; }
.sum-sec h4 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.02em; }
.sum-sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
.sum-sec ul.todo { list-style: none; padding-left: 0; }
.sum-sec ul.todo li { position: relative; padding-left: 24px; }
.sum-sec ul.todo li::before { content: ""; position: absolute; left: 2px; top: 3px; width: 13px; height: 13px; border: 2px solid var(--line); border-radius: 4px; }
.flag { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.flag:first-of-type { border-top: 0; padding-top: 2px; }
.flag b { font-size: 15px; }
.flag .val { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 4px; }
.flag .rng { font-size: 12.5px; color: var(--ink-3); margin-left: 4px; white-space: nowrap; }
.flag p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); word-break: keep-all; overflow-wrap: anywhere; }
.lv { display: inline-block; min-width: 38px; text-align: center; font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.lv-심각 { background: var(--danger); color: #fff; }
.lv-경계 { background: var(--accent); color: var(--accent-ink); }
.lv-주의 { background: var(--butter); color: var(--butter-ink); }
.lv-관찰 { background: color-mix(in srgb, var(--f-pre) 22%, transparent); color: var(--f-pre); }
.sum-nums summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--accent); padding: 4px 0; }
.ntbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin-top: 6px; }
.ntbl th, .ntbl td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.ntbl th[scope="rowgroup"] { font-size: 12px; color: var(--ink-3); font-weight: 700; padding-top: 12px; border-top: 0; }
.ntbl td.v { font-weight: 700; white-space: nowrap; }
.ntbl td.r { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
.ntbl tr.low td.v, .ntbl tr.high td.v { color: var(--accent); }
.ntbl tr.low td.v::after { content: " ↓"; } .ntbl tr.high td.v::after { content: " ↑"; }
.sum-src { font-size: 12.5px; color: var(--ink-3); }
.doc-pages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.doc-pages::-webkit-scrollbar { display: none; }
.doc-pages .pg { flex: none; width: 74px; aspect-ratio: 0.74; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); padding: 0; position: relative; }
.doc-pages .pg img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.doc-pages .pg span { position: absolute; right: 4px; bottom: 4px; font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, 0.55); border-radius: 999px; padding: 0 6px; line-height: 16px; }
.up-steps { display: flex; flex-direction: column; gap: 10px; }
.up-step { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 15px; color: var(--ink-3); }
.up-step .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.up-step .ck .ic { width: 14px; height: 14px; stroke-width: 3; }
.up-step.now { color: var(--ink); font-weight: 700; }
.up-step.now .ck { border-color: var(--accent); border-top-color: transparent; animation: spin 0.9s linear infinite; }
.up-step.done { color: var(--ink-2); }
.up-step.done .ck { background: var(--f-pre); border-color: var(--f-pre); color: #fff; }
.up-step.fail { color: var(--danger); }
.up-step .pc { font-variant-numeric: tabular-nums; font-size: 13px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .up-step.now .ck { animation: none; border-top-color: var(--accent); } }
.bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.25s ease; }
.fld select { background-image: none; }
.mini-note { font-size: 12.5px; color: var(--ink-3); }

/* 건강 체크 · 호흡수 */
.fam-hl { background: var(--f-hl); } .u-hl { background: color-mix(in srgb, var(--f-hl) 22%, transparent); } .u-dot-hl { background: var(--f-hl); }
.srr-pad { width: 100%; min-height: 220px; border-radius: 24px; border: 0; background: var(--accent-soft); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.srr-pad b { font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.srr-pad span { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.srr-pad.done { background: var(--surface-2); }
.srr-res { text-align: center; font-size: 17px; font-weight: 700; }
.warn-box { background: var(--accent-soft); border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.warn-box b { color: var(--accent); }
.warn-box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.report { white-space: pre-wrap; font-size: 14px; line-height: 1.55; background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; overflow-wrap: anywhere; word-break: keep-all; }
.cyc-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.cyc-row:first-child { border-top: 0; padding-top: 0; }
.cyc-row .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; }
.cyc-row .head b { font-size: 16px; white-space: nowrap; }
.cyc-row .head .s { margin-left: auto; text-align: right; }
.cyc-row .s { font-size: 13.5px; color: var(--ink-2); }
.cyc-row .pick button { padding: 6px 11px; }
.cyc-row.focus { background: var(--surface-2); border-radius: 12px; padding: 12px; margin: 0 -12px; border-top-color: transparent; }

/* ───────── 밝은 테마 (고양이 수첩) ─────────
 * 바탕은 우유빛, 포인트는 또롱이 코 같은 분홍, 강조는 호박색 눈 같은 노랑.
 * 한 군데만 힘을 줘요: 홈 맨 위 또롱이 사진에 고양이 귀. 나머지는 조용하고 둥글게. */
body { font-size: 15.5px; letter-spacing: -0.01em; }
.view-head h1 { font-size: 27px; letter-spacing: -0.02em; color: var(--ink); }
.card { border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--card-edge); }
.card-head h2 { font-size: 16.5px; font-weight: 800; }
.link { font-weight: 700; }
.chip { font-weight: 700; }
.chip.butter { background: var(--butter); }
.tag { border-radius: 999px; padding: 1px 8px; }
.btn { border-radius: 999px; padding: 13px 18px; font-weight: 800; letter-spacing: -0.01em; }
.btn.sm { border-radius: 999px; padding: 8px 14px; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }

/* 기록 탭: 지난 기록은 처음에 최근 10개, 더 보기를 누를 때마다 20개씩 더 펼쳐요 (검색할 때는 다 보여요) */
const REC_FIRST = 10, REC_STEP = 20;
function recSets(p) {
  const T = todayStr(); const q = S.q.trim().toLowerCase();
  const hit = (arr) => !q || arr.some((x) => String(x || '').toLowerCase().includes(q));
  const recs = S.filter === 'doc' ? [] : recsOf(p.id).filter((r) => {
    const fam = TYPES[r.type]?.fam || 'out';
    if (S.filter !== 'all' && fam !== S.filter) return false;
    return hit([r.title, r.place, r.memo, r.result, TYPES[r.type]?.label, r.type === 'weight' ? wt(r.kg) : '']);
  });
  /* 병원 문서는 전체 · 병원·검사 · 병원 문서에서 기록과 같이 날짜 순으로 */
  const docs = ['all', 'med', 'doc'].includes(S.filter) ? S.docs.filter((d) => (!d.pet || d.pet === p.id) && isDate(d.date) && hit([docTitle(d), d.hospital, DOC_KINDS[d.kind], d.sum && d.sum.oneLine, ...((d.sum && d.sum.points) || []), ...((d.sum && d.sum.flags) || []).map((f) => f.item)])).map((d) => ({ id: d.id, date: d.date, time: '', type: 'doc', doc: d })) : [];
  const rs = recs.concat(docs);
  return { q, rs, future: rs.filter((r) => r.date > T).sort(byDateAsc), past: rs.filter((r) => r.date <= T).sort(byDateDesc) };
}
/* 날짜로 찾기: 그날 기록(없으면 가장 가까운 날 기록)까지 펼치고 그 줄로 내려가요 */
function recJump(D) {
  const p = mainPet(); if (!ready() || !p) return;
  const { past } = recSets(p);
  if (!past.length) { toast('지난 기록이 없어요.'); return; }
  let i = past.findIndex((r) => r.date <= D);
  if (i < 0) i = past.length - 1;
  else if (i > 0 && past[i].date !== D && diffDays(D, past[i - 1].date) < diffDays(past[i].date, D)) i -= 1;
  const hit = past[i];
  S.recLimit = Math.max(S.recLimit, i + 6);
  S.recJump = { date: D, id: hit.id, scroll: true };
  renderRecords();
  const yk = (d) => (d.slice(0, 4) === todayStr().slice(0, 4) ? mdKo(d) : `${Number(d.slice(0, 4))}년 ${mdKo(d)}`);
  if (hit.date !== D) toast(`${yk(D)}엔 기록이 없어서 가장 가까운 ${yk(hit.date)} 기록을 보여 드려요`);
}

/* ───────── 달력: 기록·일정·간식·지출을 한 달에 모아 보기 ─────────
 * 칸에는 기록(예정 포함), 생일·온 날·함께한 N일, 보험료, 예방약 예상, 간식 개수(사료 빼고), 지출을 보여 줘요.
 * 날을 누르면 아래에 그날 것을 모두(약 체크·사진·한 줄 기록 포함) 보여 줘요. */
const CAL_CATS = [['med', '병원·검사'], ['pre', '접종·예방'], ['wt', '몸무게'], ['out', '나들이·기념'], ['care', '돌봄'], ['hl', '건강 체크'], ['snack', '간식'], ['money', '지출']];
const CAL_ORDER = ['med', 'pre', 'out', 'hl', 'wt', 'care', 'money', 'snack'];
const CAL_HIDE = 'ddorong-cal-hide';
function calHidden() { try { const a = JSON.parse(store.get(CAL_HIDE) || '[]'); return new Set(Array.isArray(a) ? a : []); } catch { return new Set(); } }
const manwon = (n) => { const v = Math.round(Number(n) || 0); return v >= 10000 ? `${Math.round(v / 1000) / 10}만` : `${v.toLocaleString('ko-KR')}원`; };
/* 사료처럼 간식 합계에서 빼는 종류는 빼고 센 간식 수와 내역 */
function calSnacks(d) {
  const x = dayDoc('snacks', d);
  const bits = snackCfg().filter((it) => !it.meal && Number(x[it.id]) > 0).map((it) => [it.name, Number(x[it.id])]);
  return { n: bits.reduce((s, b) => s + b[1], 0), bits };
}
/* from~to 사이 날짜마다 보여 줄 것 [{fam, label, ...}] */
function calEvents(from, to, hide) {
  const T = todayStr(); const out = new Map();
  const add = (d, ev) => { if (d < from || d > to || hide.has(ev.fam)) return; if (!out.has(d)) out.set(d, []); out.get(d).push(ev); };
  const home = new Set(homePets().map((p) => p.id));
  for (const r of S.records) {
    if (!isDate(r.date)) continue;
    const t = TYPES[r.type] || { label: '기록', fam: 'out' };
    if (home.has(r.pet)) add(r.date, { fam: t.fam, label: r.type === 'weight' ? wt(r.kg) : r.title || t.label, time: r.time || '', rec: r });
    if (r.type === 'milestone' && r.yearly) {
      const p0 = parts(r.date); const pet = S.pets[r.pet]; const nm = pet?.name || '';
      for (let y = Math.max(parts(from).y, p0.y + 1); y <= parts(to).y; y++) {
        const d = `${y}-${pad(p0.m)}-${pad(Math.min(p0.d, dim(y, p0.m)))}`; const n = y - p0.y;
        let title = r.title || '기념일', sub = `${n}주년`;
        if (r.kind === 'birth') { title = `${nm} 생일`; sub = pet?.status === 'star' ? '기억하는 날' : `${n}살이 돼요`; }
        else if (r.kind === 'home') { title = `${nm} 온 날`; sub = `함께한 지 ${n}년`; }
        add(d, { fam: 'out', label: title, title, sub, act: `data-act="open-record" data-id="${esc(r.id)}"` });
      }
    }
  }
  for (const p of homePets()) {
    if (!isDate(p.home)) continue;
    for (const M of DAY_STEPS) add(addDays(p.home, M - 1), { fam: 'out', label: `${M.toLocaleString('ko-KR')}일`, title: `함께한 ${M.toLocaleString('ko-KR')}일`, sub: p.name });
  }
  for (const u of upcoming()) if (u.guess) add(u.date, { fam: u.fam, label: `${u.short || '예정'}?`, title: u.title, sub: u.sub, act: u.act === 'cycle' ? `data-act="cycle" data-pet="${esc(u.pet)}" data-cyc="${esc(u.cyc)}"` : '' });
  /* 병원 문서: 문서에 적힌 날(검진일·진료일)에 */
  for (const d of S.docs) if (isDate(d.date) && (!d.pet || home.has(d.pet))) add(d.date, { fam: 'med', label: DOC_SHORT[d.kind] || '문서', doc: d });
  /* 건강 체크: 토한 날, 호흡수 잰 날, 밥을 안 먹은 끼니 */
  if (!hide.has('hl') || !hide.has('care')) {
    for (let d = from; d <= to && d <= T; d = addDays(d, 1)) {
      const h = dayDoc('health', d);

async function snackCfgSave(btn) {

    if (!name) { if (x.fresh) continue; toast('간식 이름을 적어 주세요. 안 쓰는 종류는 ✕로 지울 수 있어요.'); return; }

}
/* 넉 달보다 오래된 사진까지 한 번에 불러와요 (사진첩을 열 때만, 2분에 한 번) */
function loadAlbum(force) {
  if (!ready() || S.album.loading) return;
  if (!force && S.album.loadedAt && Date.now() - S.album.loadedAt < 120000) return;
  if (!force && S.album.failed && Date.now() - S.album.failed < 30000) return;
  S.album.loading = true;
  gsr('getDiaryAll').then((txt) => {
    const all = JSON.parse(txt || '{}');
    const byM = {};
    for (const [d, doc] of Object.entries(all)) if (isDate(d)) (byM[ym(d)] = byM[ym(d)] || {})[d] = doc;
    const newer = (a, b) => String((a && a.updatedAt) || '') >= String((b && b.updatedAt) || '');
    const end = ym(todayStr());
    for (let k = minMonth(), g = 0; k <= end && g < 600; k = addMonths(`${k}-01`, 1).slice(0, 7), g++) {
      const got = byM[k] || {};
      for (const src of [S.hist.diary[k] || {}, (S.raw && S.raw.diary) || {}]) {
        for (const [d, doc] of Object.entries(src)) if (ym(d) === k && (!got[d] || newer(doc, got[d]))) got[d] = doc;
      }
      S.hist.diary[k] = got;
    }
    S.album.loadedAt = Date.now(); S.album.failed = 0;
  }).catch(() => { S.album.failed = Date.now(); }).finally(() => { S.album.loading = false; softRender(); });
}

function lbWarm() {
  if ($('#lightbox').hidden) return;
  const id = LB.ids[LB.i]; if (!id || !PH.full.get(id)) return;
  let add = false;
  for (const j of [LB.i + 1, LB.i - 1, LB.i + 2, LB.i - 2, LB.i + 3]) {

    if (x && !PH.full.get(x) && !PH.missing.has(`full:${x}`) && !PH.flying.has(`full:${x}`)) { PH.want.full.add(x); add = true; }

}
/* 끼니에 붙인 약 ↔ 약 탭: 같은 이름의 복용약이 있으면 그 약에서 끼니 시간과 2시간 안쪽인 때에 잇고, 없으면 끼니 시간으로 새 때를 만들어요.
 * 약 탭에 없는 약은 오늘부터 새로 넣어요. 끼니에서 만든 때(meal)는 끼니 시간을 따라가고, 끼니에서 빼면 같이 빠져요. */
function feedMedPlan(feeding) {
  const T = todayStr();
  const list = medItems().map(medStored).map((m) => ({ ...m, times: (m.times || []).map((t) => ({ ...t })) }));
  const orig = JSON.stringify(list);
  const live = (m) => !m.off || m.off > T;
  const key = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  const used = new Set(); const made = [];
  for (const row of feeding) {
    const mins = feedMins(row.time); if (mins === null) continue;
    const hm = minsHm(mins); const at = mins % 1440;
    for (const a of (row.adds || []).filter((x) => x.type === 'med')) {
      /* 같은 이름이면 같은 약 (복용약을 먼저 찾아요) */
      let m = (a.med && list.find((x) => x.id === a.med && live(x))) || list.find((x) => live(x) && x.kind === 'oral' && key(x.name) === key(a.name)) || list.find((x) => live(x) && key(x.name) === key(a.name));
      if (!m) { m = { id: medUid('md'), kind: 'oral', name: a.name, dose: a.dose, times: [], from: T, off: '' }; list.push(m); made.push(a.name); }
      let t = a.slot && a.med === m.id ? m.times.find((x) => x.id === a.slot && !used.has(`${m.id}.${x.id}`)) || null : null;
      if (t && t.meal && t.meal !== row.id) t = null;
      if (!t) {
        let bd = 121;
        for (const x of m.times) {
          if (x.meal || used.has(`${m.id}.${x.id}`)) continue;
          const xm = hmMins(x.time); if (xm === null) continue;
          const dd = Math.min(Math.abs(xm - at), 1440 - Math.abs(xm - at));
          if (dd < bd) { bd = dd; t = x; }
        }
      }
      if (!t) { t = { id: medUid('t'), label: `${row.time} 밥`, time: hm, meal: row.id }; m.times.push(t); m.times.sort(byTime); }
      else if (t.meal === row.id && t.time !== hm) { t.time = hm; t.label = `${row.time} 밥`; m.times.sort(byTime); }
      used.add(`${m.id}.${t.id}`);
      a.med = m.id; a.slot = t.id;
    }
  }
  const items = [];
  for (const m of list) {
    const keep = m.times.filter((t) => !t.meal || used.has(`${m.id}.${t.id}`));
    if (keep.length === m.times.length) { items.push(m); continue; }
    if (keep.length) { items.push({ ...m, times: keep }); continue; }
    /* 남은 때가 없으면: 전에 체크한 적이 있으면 오늘부터 빼서 지난 기록을 남기고, 없으면 지워요 */
    if (medUsedBefore(m, T)) items.push({ ...m, off: m.off && m.off <= T ? m.off : T });
  }
  return { items, changed: JSON.stringify(items) !== orig, made };
}

const BUILD = '2026-10-28a';
