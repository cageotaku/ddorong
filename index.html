<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또롱이 수첩</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="또롱이 수첩">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<script src="config.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: 엄지 한 손으로 넘기는 세로 카드 한 줄 + 아래 탭바. 쪼랭이 페이지만 밤하늘 한 장. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --ink: #1B1F2E;
  --ink-2: #4F5567;
  --ink-3: #82889A;
  --line: #E0E3E9;
  --accent: #C9431F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE5DC;
  --butter: #FFD25C;
  --butter-ink: #3A2B00;
  --f-med: #D0466A;
  --f-pre: #138F7D;
  --f-wt: #4861DD;
  --f-care: #C48608;
  --f-out: #8760CF;
  --danger: #B8322A;
  --scrim: rgba(16, 19, 30, 0.42);
  --shadow: 0 1px 2px rgba(22, 27, 45, 0.05), 0 6px 20px rgba(22, 27, 45, 0.06);
  --night: #1B2046;
  --night-2: #2C3372;
  --night-ink: #EEF0FF;
  --night-ink-2: #B6BCE8;
  --star: #FFE19A;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
  --r: 20px;
  --r-sm: 12px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101218; --surface: #1A1D27; --surface-2: #232734; --ink: #ECEEF5; --ink-2: #ADB2C2; --ink-3: #7E8497;
    --line: #2B303E; --accent: #FF7A55; --accent-ink: #1E0E08; --accent-soft: #3B231A; --butter: #E8C04C; --butter-ink: #261C00;
    --f-med: #F0779C; --f-pre: #3CC6B1; --f-wt: #8799FF; --f-care: #E6AE3C; --f-out: #B697F3; --danger: #FF8074;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.32);
    --night: #141834; --night-2: #232A60; --night-ink: #EEF0FF; --night-ink-2: #AEB5E4; --star: #FFE19A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101218; --surface: #1A1D27; --surface-2: #232734; --ink: #ECEEF5; --ink-2: #ADB2C2; --ink-3: #7E8497;
  --line: #2B303E; --accent: #FF7A55; --accent-ink: #1E0E08; --accent-soft: #3B231A; --butter: #E8C04C; --butter-ink: #261C00;
  --f-med: #F0779C; --f-pre: #3CC6B1; --f-wt: #8799FF; --f-care: #E6AE3C; --f-out: #B697F3; --danger: #FF8074;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.32);
  --night: #141834; --night-2: #232A60; --night-ink: #EEF0FF; --night-ink-2: #AEB5E4; --star: #FFE19A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-fill { fill: currentColor; stroke: none; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 92px);
}
.view { display: flex; flex-direction: column; gap: 14px; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 2px 2px; }
.view-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
.banner { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 12px 14px; color: var(--ink-2); font-size: 14px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.card-head .sub { color: var(--ink-3); font-size: 13px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.muted { color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; }

/* hero: 등록증 같은 프로필 카드 */
.hero { padding: 18px 16px 16px; gap: 14px; }
.hero-top { display: flex; gap: 14px; align-items: center; }
.avatar { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--butter); color: var(--butter-ink); display: grid; place-items: center; overflow: hidden; border: 0; padding: 0; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .mono { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.avatar .cam { position: absolute; right: 2px; bottom: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--ink-2); display: grid; place-items: center; box-shadow: var(--shadow); }
.avatar .cam .ic { width: 15px; height: 15px; }
.hero-name { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hero-name h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; }
.hero-name .meta { color: var(--ink-2); font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.butter { background: var(--butter); color: var(--butter-ink); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); padding-top: 12px; }
.fields div { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; border-left: 1px solid var(--line); min-width: 0; }
.fields div:first-child { border-left: 0; padding-left: 0; }
.fields dt { font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em; }
.fields dd { margin: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* rows */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; border-top: 1px solid var(--line); }
.list > .row:first-child { border-top: 0; }
.row-date { display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-variant-numeric: tabular-nums; }
.row-date b { font-size: 15px; font-weight: 700; }
.row-date small { font-size: 12px; color: var(--ink-3); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.row-sub { color: var(--ink-3); font-size: 13px; display: block; }
.row-sub .dot { margin-right: 6px; vertical-align: 1px; }
.row-sub .tag { margin-left: 6px; display: inline-block; vertical-align: 1px; }
.row-end { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-end.amt { font-size: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.fam-med { background: var(--f-med); } .fam-pre { background: var(--f-pre); } .fam-wt { background: var(--f-wt); }
.fam-care { background: var(--f-care); } .fam-out { background: var(--f-out); }
.tag { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
.tag.warn { background: var(--accent-soft); color: var(--accent); }
.tag.gc { background: var(--surface-2); color: var(--f-wt); }
.sync-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); padding: 0 4px; flex-wrap: wrap; }
.sync-line .dot { width: 7px; height: 7px; }
.sync-ok { background: var(--f-pre); } .sync-warn { background: var(--accent); } .sync-off { background: var(--ink-3); }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.rules b { color: var(--ink); }
.status-box { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.status-box .head { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); }
.dchip { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.dchip.soon { background: var(--butter); color: var(--butter-ink); }
.dchip.today { background: var(--accent); color: var(--accent-ink); }
.month-h { font-size: 13px; font-weight: 700; color: var(--ink-3); padding: 14px 0 2px; letter-spacing: 0.02em; }
.month-h:first-child { padding-top: 0; }

/* weight */
.big { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.big small { font-size: 18px; font-weight: 600; margin-left: 2px; }
.stat-line { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.delta { color: var(--ink-2); font-size: 14px; }
.note { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
.note b { color: var(--ink); }
.chart { position: relative; width: 100%; min-height: 170px; touch-action: pan-y; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.chart .endlbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.1; }
.chart .enddot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.chart .hov { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 12px; line-height: 1.35; pointer-events: none; white-space: nowrap; text-align: center; }
.tip b { font-size: 14px; }
.night .chart .ax { fill: var(--night-ink-2); }
.night .chart .endlbl { fill: var(--night-ink); }
.night .chart .grid { stroke: rgba(255, 255, 255, 0.12); }
.night .chart .ln { stroke: var(--star); }
.night .chart .area { fill: var(--star); opacity: 0.12; }
.night .chart .enddot, .night .chart .hov { fill: var(--star); stroke: var(--night); }
.night .chart .cross { stroke: var(--night-ink-2); }
.night .tip { background: var(--night-ink); color: var(--night); }

/* money */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.bar-row .lbl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .track { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 3px; }
.bar-row .val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.bar-row.sel .lbl { color: var(--ink); font-weight: 700; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav strong { font-size: 17px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.split { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* filters */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 0 14px; border: 1px solid var(--line); }
.search input { border: 0; background: none; outline: none; padding: 11px 0; font-size: 16px; width: 100%; min-width: 0; }
.search .ic { color: var(--ink-3); width: 18px; height: 18px; }

/* info */
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.feed { display: flex; flex-direction: column; }
.feed-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; align-items: center; }
.feed-row:first-child { border-top: 0; }
.feed-row .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); }
.phone { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.phone span { user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; font-weight: 600; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { background: none; color: var(--danger); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }

/* memorial */
.night { background: radial-gradient(120% 90% at 85% 0%, var(--night-2), var(--night) 70%); color: var(--night-ink); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.night::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.9;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 28% 68%, var(--night-ink), transparent 60%),
    radial-gradient(1.2px 1.2px at 47% 18%, var(--night-ink), transparent 60%),
    radial-gradient(1.6px 1.6px at 66% 44%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 78% 80%, var(--night-ink), transparent 60%),
    radial-gradient(1.3px 1.3px at 91% 30%, var(--night-ink), transparent 60%),
    radial-gradient(1px 1px at 8% 86%, var(--star), transparent 60%); }
.night > * { position: relative; }
.night .muted, .night .sub { color: var(--night-ink-2); }
.star-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; padding: 16px; border-radius: var(--r); }
.star-ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.08); color: var(--star); flex: none; overflow: hidden; }
.star-ic img { width: 100%; height: 100%; object-fit: cover; }
.star-ic .ic { width: 22px; height: 22px; }
.star-card .nm { font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
.star-card .ds { font-size: 13px; color: var(--night-ink-2); }
.star-card .go { margin-left: auto; color: var(--night-ink-2); }
.mem-hero { padding: 22px 18px 18px; border-radius: var(--r); display: flex; flex-direction: column; gap: 14px; }
.mem-hero h1 { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1; margin: 0; }
.mem-hero .line { font-size: 15px; color: var(--night-ink-2); }
.mem-hero .line b { color: var(--night-ink); }
.mem-top { display: flex; align-items: center; gap: 14px; }
.mem-top .avatar { width: 64px; height: 64px; background: rgba(255, 255, 255, 0.1); color: var(--star); }
.mem-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid rgba(255, 255, 255, 0.14); padding-top: 12px; }
.mem-facts div { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; border-left: 1px solid rgba(255, 255, 255, 0.14); min-width: 0; }
.mem-facts div:first-child { border-left: 0; padding-left: 0; }
.mem-facts dt { font-size: 12px; color: var(--night-ink-2); }
.mem-facts dd { margin: 0; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.back-btn { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--ink-2); font-weight: 600; padding: 6px 0; font-size: 15px; }
.back-btn .ic { width: 20px; height: 20px; }

/* tab bar & fab */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11px; font-weight: 600; min-width: 0; padding: 0; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 21; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(201, 67, 31, 0.32);
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 2px); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 16px); } }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.2; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up 0.22s ease-out;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

function renderRecords() {
  const p = mainPet(); const T = todayStr();

  const q = S.q.trim().toLowerCase();
  const rs = recsOf(p.id).filter((r) => {
    const fam = TYPES[r.type]?.fam || 'out';
    if (S.filter !== 'all' && fam !== S.filter) return false;
    if (!q) return true;
    return [r.title, r.place, r.memo, r.result, TYPES[r.type]?.label, r.type === 'weight' ? wt(r.kg) : ''].some((x) => String(x || '').toLowerCase().includes(q));
  });
  $('#rec-count').textContent = `${rs.length}개`;
  const future = rs.filter((r) => r.date > T).sort(byDateAsc);
  const past = rs.filter((r) => r.date <= T).sort(byDateDesc);
  let html = '';
  if (S.filter === 'wt' && !q) {
    const ws = weightsOf(p.id);
    if (ws.length > 1) html += `<div class="card"><div class="card-head"><h2>${esc(p.name)}가 자라온 길</h2><span class="sub">${esc(wt(ws[0].kg))} → ${esc(wt(ws[ws.length - 1].kg))}</span></div><div class="chart" data-chart="${esc(p.id)}" role="img" aria-label="몸무게 그래프"></div></div>`;
  }

  if (past.length) {
    let cur = ''; let body = '';

  list.innerHTML = html;
}

function diaryUpload(date) {
  if (!canEdit()) { toast('기록을 다 불러온 뒤에 올려 주세요.'); return; }
  pickPhotos(async (files) => {
    const list = files.slice(0, 30);
    if (files.length > 30) toast('한 번에 30장까지 올릴 수 있어요. 앞의 30장만 올릴게요.');
    S.uploading[date] = (S.uploading[date] || 0) + list.length; render();
    let ok = 0, lastErr = null;
    for (const f of list) {
      try {
        const c = await compressImage(f);
        const uid = newId('u');
        const r = JSON.parse(await retry(() => gsr('addDiaryPhoto', date, c.thumb, c.full, uid)));
        PH.thumb.set(r.id, c.thumb); PH.full.set(r.id, c.full); tcPut(r.id, c.thumb);
        setBase('diary', date, r.doc); ok++;
      } catch (e) { lastErr = e; }
      S.uploading[date] = Math.max(0, (S.uploading[date] || 1) - 1);
      S.lastWriteAt = Date.now(); render();
    }
    saveCache();
    const fail = list.length - ok;
    toast(!fail ? `사진 ${ok}장을 올렸어요` : ok ? `${ok}장은 올렸고 ${fail}장은 못 올렸어요. 다시 시도해 주세요.` : photoErr(lastErr));
  });
}
async function diaryRemove(date, id) {

/* ───────── chart ───────── */
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach((box) => {
    if (box.offsetParent === null) return;
    const ws = weightsOf(box.dataset.chart);
    if (ws.length < 2) { box.innerHTML = ''; return; }
    const W = Math.max(260, Math.round(box.clientWidth)); const H = 176;
    const m = { l: 34, r: 46, t: 14, b: 24 };
    const x0 = utc(ws[0].date), x1 = utc(ws[ws.length - 1].date);
    const maxKg = Math.max(...ws.map((w) => Number(w.kg)));
    const step = maxKg <= 3 ? 0.5 : 1;
    const yMax = Math.max(step, Math.ceil((maxKg + step * 0.15) / step) * step);
    const X = (d) => m.l + ((utc(d) - x0) / Math.max(1, x1 - x0)) * (W - m.l - m.r);
    const Y = (k) => m.t + (1 - k / yMax) * (H - m.t - m.b);
    let grid = '';
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      const y = Y(v).toFixed(1); const top = v + step > yMax + 1e-9;
      grid += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${+v.toFixed(1)}${top ? 'kg' : ''}</text>`;
    }
    const spanDays = (x1 - x0) / 864e5; const p0 = parts(ws[0].date);
    const every = spanDays > 300 ? 3 : spanDays > 120 ? 2 : 1;
    let ticks = ''; let y = p0.y, mo = p0.m + 1; if (mo > 12) { mo = 1; y++; }
    let first = true;
    for (let g = 0; g < 60; g++) {
      const d = `${y}-${pad(mo)}-01`; if (utc(d) > x1) break;
      if ((mo - 1) % every === 0) {
        const x = X(d);
        if (x > m.l + 10 && x < W - m.r - 10) { ticks += `<text class="ax" x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle">${mo === 1 || first ? `${String(y).slice(2)}.${mo}` : `${mo}월`}</text>`; first = false; }
      }
      mo++; if (mo > 12) { mo = 1; y++; }
    }
    const pts = ws.map((w) => [X(w.date), Y(Number(w.kg))]);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
    const area = `${line}L${pts[pts.length - 1][0].toFixed(1)} ${Y(0).toFixed(1)}L${pts[0][0].toFixed(1)} ${Y(0).toFixed(1)}Z`;
    const lp = pts[pts.length - 1];
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${grid}${ticks}<path class="area" d="${area}"/><path class="ln" d="${line}"/><line class="cross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/><circle class="hov" r="5" cx="0" cy="0" visibility="hidden"/><circle class="enddot" r="4.5" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}"/><text class="endlbl" x="${(lp[0] + 8).toFixed(1)}" y="${(lp[1] + 4).toFixed(1)}">${esc(wt(ws[ws.length - 1].kg))}</text></svg><div class="tip" hidden></div>`;
    const svg = box.querySelector('svg'); const tip = box.querySelector('.tip'); const cross = svg.querySelector('.cross'); const hov = svg.querySelector('.hov');
    const show = (clientX) => {
      const r = svg.getBoundingClientRect(); const sx = ((clientX - r.left) / r.width) * W;
      let bi = 0, bd = Infinity; pts.forEach((p, i) => { const d = Math.abs(p[0] - sx); if (d < bd) { bd = d; bi = i; } });
      const p = pts[bi]; const w = ws[bi];
      cross.setAttribute('x1', p[0]); cross.setAttribute('x2', p[0]); cross.setAttribute('visibility', 'visible');
      hov.setAttribute('cx', p[0]); hov.setAttribute('cy', p[1]); hov.setAttribute('visibility', 'visible');
      tip.hidden = false; tip.innerHTML = `<b>${esc(wt(w.kg))}</b><br>${esc(dot(w.date))}`;
      const px = (p[0] / W) * r.width; const half = tip.offsetWidth / 2;
      tip.style.left = `${Math.min(r.width - half, Math.max(half, px))}px`;
      tip.style.top = `${Math.max(0, (p[1] / H) * r.height - tip.offsetHeight - 12)}px`;
    };
    const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); hov.setAttribute('visibility', 'hidden'); };
    svg.addEventListener('pointermove', (e) => show(e.clientX));
    svg.addEventListener('pointerdown', (e) => show(e.clientX));
    svg.addEventListener('pointerleave', hide);
  });
}

/* ───────── writes ───────── */
function errText(e) { return String((e && (e.message || e.name)) || e || ''); }
function writeError(e) {
  const msg = errText(e), code = e && e.code;
  if (AUTH_CODES.includes(code) || code === 'NEED_KEY') return;
  if (code === 'NO_SERVER') { toast('앱 설정에 서버 주소가 없어요.'); return; }
  if (code === 'NET') { toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'); return; }
  if (/TOO_BIG/.test(msg)) { toast('내용이 너무 길어요. 메모를 조금 줄여 주세요.'); return; }
  if (/lock|timed out|timeout/i.test(msg)) { toast('둘이 동시에 저장하고 있어요. 잠시 뒤 다시 눌러 주세요.'); return; }
  toast('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.');
}
function cleanDoc(data) {
  const d = {};
  for (const [k, v] of Object.entries(data || {})) if (k !== 'id' && k[0] !== '_' && v !== undefined) d[k] = v;
  if (data && data._sig) d.gsig = data._sig;
  if (data && data._ev && !d.gcal) d.gcal = data._ev;
  return d;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function retry(fn) {
  try { return await fn(); } catch (e) {
    if (e && (e.code === 'NET' || /Service|서비스/i.test(errText(e)))) { await sleep(700 + Math.random() * 700); return fn(); }
    throw e;
  }
}
function writable() {
  if (!ready()) { toast('기록을 다 불러온 뒤에 저장해 주세요.'); return false; }
  if (S.fromCache) { toast('최신 기록을 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.'); load(); return false; }
  return true;
}
function afterWrite() { S.lastWriteAt = Date.now(); buildView(); saveCache(); render(); }
async function put(col, id, data) {

    await retry(() => gsr('setDoc', col, id, JSON.stringify(doc)));
    S.raw[col] = { ...(S.raw[col] || {}), [id]: doc };
    afterWrite(); return true;
  } catch (e) { writeError(e); return false; }
}

}

/* 기록 저장: 서버가 공유 캘린더에도 올리거나(새 기록) 고쳐요(캘린더 일정) */
function putEvent(ev) { if (ev) S.events = (S.events || []).filter((x) => x.id !== ev.id).concat([ev]); }
async function saveRec(id, data, orig) {
  if (!writable()) return null;
  const doc = cleanDoc(data);
  const prev = orig ? cleanDoc(orig) : null;

function readImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('BAD_IMAGE')); };
    img.src = url;
  });
}
function toJpeg(img, max, q) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const sc = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * sc)); c.height = Math.max(1, Math.round(h0 * sc));
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function compressImage(file) {
  const loaded = await readImage(file);
  try {
    const full = toJpeg(loaded.img, 1600, 0.85);
    let thumb = toJpeg(loaded.img, 360, 0.72);
    if (thumb.length > 45000) thumb = toJpeg(loaded.img, 240, 0.6);
    return { full, thumb };
  } finally { URL.revokeObjectURL(loaded.url); }
}

  return '사진을 올리지 못했어요. 다시 시도해 주세요.';
}

  const f = (id, label, val, type = 'text', ph = '') => `<div class="fld"><label for="${id}">${label}</label><input type="${type}" id="${id}" value="${esc(val || '')}" placeholder="${esc(ph)}"></div>`;
  const html = `<form class="form" id="pet-form" novalidate>
    ${f('p-name', '이름', p.name)}
    <div class="two">${f('p-breed', '품종', p.breed, 'text', '먼치킨')}${f('p-sex', '성별', p.sex, 'text', '남아')}</div>
    <div class="two">${f('p-birth', '생일', p.birth, 'date')}${f('p-home', '우리 집에 온 날', p.home, 'date')}</div>
    ${star ? `<div class="two">${f('p-farewell', '소풍 떠난 날', p.farewell, 'date')}${f('p-ashes', '산골한 날', p.ashes, 'date')}</div>` : `<div class="two">${f('p-neutered', '중성화', p.neutered, 'date')}${f('p-bplace', '태어난 곳', p.birthplace, 'text', '경기도')}</div>`}
    <button class="btn" type="submit">저장</button></form>`;
  F = null;
  openSheet(`${p.name} 프로필`, html, (body) => {
    body.querySelector('#pet-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = (id) => ($(`#${id}`) ? $(`#${id}`).value.trim() : undefined);
      const d = { name: v('p-name') || p.name, breed: v('p-breed'), sex: v('p-sex'), birth: v('p-birth'), home: v('p-home') };
      if (star) { d.farewell = v('p-farewell'); d.ashes = v('p-ashes'); } else { d.neutered = v('p-neutered'); d.birthplace = v('p-bplace'); }
      if (await patch('pets', pid, d)) { await closeSheet(); toast('저장했어요'); }
    });
  });
}
function feedForm(pid) {
  const p = S.pets[pid]; const rows = (p.feeding || []).map((x) => ({ ...x }));
  const rowHtml = (x, i) => `<div class="two" data-frow="${i}" style="grid-template-columns:minmax(0,0.9fr) minmax(0,1.3fr) minmax(0,0.9fr) auto;align-items:end">
    <div class="fld"><label for="fr-t-${i}">시간</label><input type="text" id="fr-t-${i}" value="${esc(x.time)}" placeholder="오전 9시"></div>
    <div class="fld"><label for="fr-w-${i}">무엇을·얼마나</label><input type="text" id="fr-w-${i}" value="${esc(x.what)}" placeholder="습식 1캔"></div>
    <div class="fld"><label for="fr-h-${i}">방법</label><input type="text" id="fr-h-${i}" value="${esc(x.how)}" placeholder="직접" list="dl-how"></div>
    <button class="icon-btn" type="button" data-act="feed-del" data-i="${i}" aria-label="이 줄 지우기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
  F = { kind: 'feed', rows };
  const draw = () => {
    const body = $('#sheet-body');
    body.querySelector('#feed-rows').innerHTML = F.rows.map(rowHtml).join('');
  };
  const html = `<form class="form" id="feed-form" novalidate>
    <div id="feed-rows" class="form"></div>${datalist('dl-how', ['직접', '자동급식기'])}
    <button class="btn ghost sm" type="button" data-act="feed-add">+ 한 줄 추가</button>
    <div class="fld"><label for="fd-sup">영양제</label><input type="text" id="fd-sup" value="${esc(p.supplement || '')}" placeholder="오메가3 1알"></div>
    <div class="fld"><label for="fd-note">메모</label><input type="text" id="fd-note" value="${esc(p.feedingNote || '')}" placeholder="몸무게가 늘면 저녁 양 줄이기"></div>
    <div class="fld"><label for="fd-kg">메모를 띄울 몸무게 (선택)</label><div class="unit"><input type="number" id="fd-kg" inputmode="decimal" step="0.01" min="0" value="${p.feedingNoteKg ?? ''}" placeholder="4.5"><span>kg</span></div><span class="hint">이 몸무게가 되면 홈 화면 몸무게 카드에 메모가 떠요.</span></div>
    <button class="btn" type="submit">저장</button></form>`;
  openSheet('밥 먹는 시간', html, (body) => {
    draw();
    const sync = () => { F.rows = F.rows.map((x, i) => ({ time: ($(`#fr-t-${i}`) || {}).value ?? x.time, what: ($(`#fr-w-${i}`) || {}).value ?? x.what, how: ($(`#fr-h-${i}`) || {}).value ?? x.how })); };
    F.sync = sync; F.draw = draw;
    body.querySelector('#feed-form').addEventListener('submit', async (e) => {
      e.preventDefault(); sync();
      const feeding = F.rows.map((x) => ({ time: x.time.trim(), what: x.what.trim(), how: x.how.trim() })).filter((x) => x.time || x.what);
      const kgv = parseFloat($('#fd-kg').value);
      const d = { feeding, supplement: $('#fd-sup').value.trim(), feedingNote: $('#fd-note').value.trim(), feedingNoteKg: kgv > 0 ? kgv : null, feedingUpdated: todayStr() };
      if (await patch('pets', pid, d)) { await closeSheet(); toast('저장했어요'); }
    });
  });
}
function insForm() {
  const ins = S.info.insurance || { company: '', product: '', joined: '', payDay: 1, firstPay: '', rates: [], payer: meKey(), method: '', active: true, coverage: [], excluded: [], notes: [], agent: { name: '', phone: '' }, pet: mainPet()?.id || '' };
  const T = todayStr(); const cur = rateFor(ins, ym(T));
  const html = `<form class="form" id="ins-form" novalidate>
    <div class="two"><div class="fld"><label for="i-co">보험사</label><input type="text" id="i-co" value="${esc(ins.company)}" placeholder="보험사 이름"></div><div class="fld"><label for="i-pr">상품</label><input type="text" id="i-pr" value="${esc(ins.product)}"></div></div>
    <div class="two"><div class="fld"><label for="i-amt">월 보험료</label><div class="unit"><input type="number" id="i-amt" inputmode="numeric" value="${cur || ''}"><span>원</span></div></div><div class="fld"><label for="i-day">결제일 (매월)</label><div class="unit"><input type="number" id="i-day" inputmode="numeric" min="1" max="31" value="${esc(ins.payDay)}"><span>일</span></div></div></div>
    <div class="two"><div class="fld"><label for="i-join">가입일</label><input type="date" id="i-join" value="${esc(ins.joined)}"></div><div class="fld"><label for="i-first">첫 결제일</label><input type="date" id="i-first" value="${esc(ins.firstPay)}"></div></div>
    <div class="fld"><label for="i-method">결제 방법</label><input type="text" id="i-method" value="${esc(ins.method)}" placeholder="○○은행 자동이체"></div>
    ${members().length ? `<div class="fld"><span class="lbl">내는 사람</span>${whoPicker('payer', ins.payer)}</div>` : ''}
    <div class="fld"><label for="i-cov">보장 (한 줄에 하나)</label><textarea id="i-cov">${esc((ins.coverage || []).join('\n'))}</textarea></div>
    <div class="fld"><label for="i-exc">보장 안 됨 (한 줄에 하나)</label><textarea id="i-exc" style="min-height:56px">${esc((ins.excluded || []).join('\n'))}</textarea></div>
    <div class="fld"><label for="i-notes">메모 (한 줄에 하나)</label><textarea id="i-notes" style="min-height:56px">${esc((ins.notes || []).join('\n'))}</textarea></div>
    <div class="two"><div class="fld"><label for="i-an">담당자</label><input type="text" id="i-an" value="${esc(ins.agent?.name || '')}"></div><div class="fld"><label for="i-ap">연락처</label><input type="tel" id="i-ap" value="${esc(ins.agent?.phone || '')}"></div></div>
    <label class="check"><input type="checkbox" id="i-active" ${ins.active ? 'checked' : ''}>지금 내고 있어요 (끄면 다음 달부터 자동 지출에서 빠져요)</label>
    <span class="hint muted" style="font-size:12.5px">월 보험료를 바꾸면 이번 달부터 새 금액으로 계산하고, 지난달까지는 예전 금액을 그대로 둬요.</span>
    <button class="btn" type="submit">저장</button></form>`;
  F = null;
  openSheet('펫보험', html, (body) => {
    bindPicks(body);
    body.querySelector('#ins-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const lines = (id) => $(`#${id}`).value.split('\n').map((s) => s.trim()).filter(Boolean);
      const amt = parseInt(String($('#i-amt').value).replace(/[^\d]/g, ''), 10) || 0;
      const day = Math.min(31, Math.max(1, parseInt($('#i-day').value, 10) || 1));
      const rates = (ins.rates || []).filter((r) => r.from < ym(T));
      if (!rates.length || rateFor({ rates }, ym(T)) !== amt) rates.push({ from: rates.length ? ym(T) : ym($('#i-first').value || T), monthly: amt });
      const active = $('#i-active').checked;
      const d = { ...ins, company: $('#i-co').value.trim(), product: $('#i-pr').value.trim(), payDay: day, joined: $('#i-join').value, firstPay: $('#i-first').value, method: $('#i-method').value.trim(), payer: pickVal(body, 'payer') ?? ins.payer ?? '', coverage: lines('i-cov'), excluded: lines('i-exc'), notes: lines('i-notes'), agent: { name: $('#i-an').value.trim(), phone: $('#i-ap').value.trim() }, rates, active };
      if (!active && ins.active) d.endedMonth = ym(T);
      if (active) delete d.endedMonth;
      if (!isDate(d.firstPay)) { toast('첫 결제일을 골라 주세요.'); return; }
      if (await put('info', 'insurance', d)) { await closeSheet(); toast('저장했어요'); }
    });
  });
}

/* ───────── actions ───────── */
const ACT = {
  noop() {},
  tab(b) { S.tab = b.dataset.tab; S.back = S.tab; if (b.dataset.dmode) setDiaryMode(b.dataset.dmode); window.scrollTo(0, 0); render(); },
  star(b) { S.starPet = b.dataset.pet; S.back = S.tab === 'star' ? S.back : S.tab; S.tab = 'star'; window.scrollTo(0, 0); render(); },
  back() { S.tab = S.back || 'home'; window.scrollTo(0, 0); render(); },
  filter(b) { S.filter = b.dataset.filter; render(); },
  'filter-go'(b) { S.filter = b.dataset.filter; S.tab = 'records'; S.back = 'records'; window.scrollTo(0, 0); render(); },
  month(b) {
    const all = allExpenses(); const months = [...new Set([...all.map((e) => ym(e.date)), ym(todayStr())])].sort();
    const i = months.indexOf(S.month) + Number(b.dataset.dir); if (i >= 0 && i < months.length) { S.month = months[i]; render(); }
  },
  'month-set'(b) { S.month = b.dataset.month; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  'add-menu'() { if (S.tab === 'diary') diaryUpload(S.diaryMode === 'album' ? todayStr() : curDay('diary')); else addMenu(); },
  /* 오늘의 또롱이: 날짜별 ↔ 사진첩 */
  'diary-mode'(b) { setDiaryMode(b.dataset.mode); window.scrollTo(0, 0); render(); },
  'album-photo'(b) {
    const list = albumList(); const i = Number(b.dataset.i);
    if (!list[i]) return;
    lbOpen(list.map((x) => x.id), i, list.map((x) => x.date), true);
  },
  'album-more'() { S.album.limit += 90; render(); },
  'album-retry'() { S.album.failed = 0; loadAlbum(true); render(); },
  'diary-add-today'() { diaryUpload(todayStr()); },
  'lb-day'() {
    const d = LB.dates[LB.i]; if (!d) return;
    lbClose(); setDiaryMode('day'); setDay('diary', d); S.tab = 'diary'; S.back = 'diary'; window.scrollTo(0, 0); render();
  },
  /* 날짜별 탭 */
  'day-set'(b) { setDay(b.dataset.tab, b.dataset.date); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  'day-move'(b) { const tab = b.dataset.tab; setDay(tab, addDays(curDay(tab), Number(b.dataset.dir))); render(); },
  'day-today'(b) { setDay(b.dataset.tab, todayStr()); render(); },
  'cal-move'(b) {
    const tab = b.dataset.tab; const k = addMonths(`${calMonth(tab)}-01`, Number(b.dataset.dir)).slice(0, 7);
    if (k > ym(todayStr()) || k < minMonth()) return;
    S.cal[tab] = k; S.calPinned[tab] = true; render();
  },
  'meds-more'() { S.medsDays = Math.min(98, S.medsDays + 14); render(); },
  'med-tap'(b) {
    const date = curDay('meds'); const f = medFind(b.dataset.id, b.dataset.t); if (!f) return;
    const [m, t] = f;
    if (medVal(dayDoc('meds', date), m, t.id) || date !== todayStr()) medSheet(date, m, t);
    else medCheck(date, m, t, hhmm());
  },
  'med-undo'() {
    if (!F || F.kind !== 'med') return;
    const { date } = F; const f = medFind(F.med, F.t); if (!f) return;
    const [m, t] = f;
    if (mut('meds', date, [['unset', medPath(m, t.id)]])) { closeSheet(); toast(`${medName(m)} ${tLabel(t)} 체크를 취소했어요`); }
  },
  'med-add'(b) { if (!S.readOnly) medForm(null, b.dataset.kind); },
  'med-edit'(b) { const m = medItems().find((x) => x.id === b.dataset.id); if (m && !S.readOnly) medForm(m); },
  'med-hist'(b) { S.medHist = b.dataset.id; render(); },
  'med-time-add'(b) {
    if (!F || F.kind !== 'medcfg') return;
    F.sync();
    const label = b.dataset.label || ''; let time = b.dataset.time || '';
    const used = new Set(F.m.times.map((t) => t.id));
    let id = '';
    if (label) {
      /* 뺐다가 다시 넣은 때는 예전 자리를 그대로 써서 지난 체크가 이어져요 */
      const prev = F.orig.find((t) => t.label === label && !used.has(t.id));
      if (prev) { id = prev.id; time = prev.time || time; }
      else if (F.m.legacy) { const s = MED_SLOTS.find(([, l]) => l === label); if (s && !used.has(s[0])) id = s[0]; }
    }
    F.m.times.push({ id: id || medUid('t'), label, time });
    if (label) F.m.times.sort(byTime);
    F.draw();
    if (!label) { const inp = $(`#mt-l-${F.m.times.length - 1}`); if (inp) inp.focus(); }
  },
  'med-time-del'(b) { if (!F || F.kind !== 'medcfg') return; F.sync(); F.m.times.splice(Number(b.dataset.i), 1); F.draw(); },
  'med-del-ask'() {
    const s = $('#med-del-slot'); if (!s) return;
    s.innerHTML = '<div class="confirm"><span>이 약을 목록에서 뺄까요? 지난 체크 기록은 그대로 남아요.</span><button class="btn sm" type="button" data-act="med-del-yes">빼기</button><button class="btn ghost sm" type="button" data-act="med-del-no">그대로 두기</button></div>';
  },
  'med-del-no'() { const s = $('#med-del-slot'); if (s) s.innerHTML = ''; },
  async 'med-del-yes'(b) {
    if (!F || F.kind !== 'medcfg') return;
    const T = todayStr(); const cur = medItems().find((x) => x.id === F.m.id);
    if (!cur) { closeSheet(); return; }
    b.disabled = true;
    /* 오늘 전에 체크한 적이 있으면 오늘부터만 빼서 지난 기록에 남기고, 없으면 아예 지워요 */
    const keep = medUsedBefore(cur, T);
    const list = medItems().map(medStored).flatMap((x) => (x.id !== cur.id ? [x] : keep ? [{ ...x, off: T }] : []));
    if (await patch('info', 'meds', { items: list })) { await closeSheet(); toast(`목록에서 뺐어요 · ${medName(cur)}`); }
    else b.disabled = false;
  },
  'home-med'(b) {
    const T = todayStr(); const f = medFind(b.dataset.id, b.dataset.t); if (!f) return;
    const [m, t] = f;
    if (medVal(dayDoc('meds', T), m, t.id)) { setDay('meds', T); S.tab = 'meds'; S.back = 'meds'; window.scrollTo(0, 0); render(); }
    else medCheck(T, m, t, hhmm());
  },
  'snack-step'(b) {
    const date = curDay('snacks'); const k = b.dataset.k; const d = Number(b.dataset.d);
    if (d < 0 && (Number(dayDoc('snacks', date)[k]) || 0) <= 0) return;
    snackChange(date, k, d);
  },
  'diary-add'() { diaryUpload(curDay('diary')); },
  'diary-note'() { diaryNoteSave(); },
  'lb-go'(b) { lbGo(Number(b.dataset.dir)); },
  'lb-del'() { LB.confirm = true; lbShow(); },
  'lb-del-no'() { LB.confirm = false; lbShow(); },
  async 'lb-del-yes'() {
    const id = LB.ids[LB.i]; const date = LB.dates[LB.i]; if (!id || !date) return;
    $('#lb-bar').innerHTML = '<span>지우는 중…</span>';
    const done = await diaryRemove(date, id);
    LB.confirm = false;
    if (!done) { lbShow(); return; }
    LB.ids.splice(LB.i, 1); LB.dates.splice(LB.i, 1);
    if (!LB.ids.length) lbClose(); else { LB.i = Math.min(LB.i, LB.ids.length - 1); lbShow(); }
    toast('사진을 지웠어요');
  },
  'add-for'(b) { addMenu(b.dataset.pet); },
  add(b) { const k = b.dataset.kind; if (k === 'expense') expenseForm(null); else recordForm(null, k, b.dataset.pet || (S.tab === 'star' ? S.starPet : undefined)); },
  'open-record'(b) { recordDetail(b.dataset.id); },
  'open-expense'(b) { expenseDetail(b.dataset.id); },
  'edit-record'(b) { const r = S.records.find((x) => x.id === b.dataset.id); if (r) recordForm(r); },
  'edit-expense'(b) { const e = allExpenses().find((x) => x.id === b.dataset.id); if (e) expenseForm(e); },
  'ask-del'(b) {
    const slot = $('#del-slot'); if (!slot) return;
    const exp = b.dataset.col === 'expenses' ? allExpenses().find((x) => x.id === b.dataset.id) : null;
    const ins = exp?.auto === 'insurance';
    const rec = b.dataset.col === 'records' ? S.records.find((x) => x.id === b.dataset.id) : null;
    const linked = rec ? gcLinked(rec) : exp?.src === 'gcal';
    const attrs = `data-act="do-del" data-col="${esc(b.dataset.col)}" data-id="${esc(b.dataset.id)}"`;
    if (rec && rec._ev && !S.readOnly) {
      slot.innerHTML = `<div class="confirm"><span>공유 캘린더 일정도 같이 지울까요?</span><button class="btn sm" ${attrs} data-cal="1">캘린더에서도 지우기</button><button class="btn ghost sm" ${attrs}>앱에서만 지우기</button><button class="btn ghost sm" data-act="cancel-del">그대로 두기</button></div>`;
      return;
    }
    const q = ins ? '이 달 보험료를 지출에서 뺄까요?' : linked ? '구글 캘린더 일정은 그대로 두고 앱에서만 지울까요?' : '이 기록을 지울까요? 되돌릴 수 없어요.';
    slot.innerHTML = `<div class="confirm"><span>${q}</span><button class="btn sm" ${attrs}>${ins ? '빼기' : '지우기'}</button><button class="btn ghost sm" data-act="cancel-del">그대로 두기</button></div>`;
  },
  'cancel-del'() { const s = $('#del-slot'); if (s) s.innerHTML = ''; },
  async 'do-del'(b) {
    const col = b.dataset.col, id = b.dataset.id; b.disabled = true;
    let ok = true;
    if (col === 'expenses') {
      const e = allExpenses().find((x) => x.id === id);
      if (e && e.auto === 'insurance') ok = await put('expenses', id, { skip: true, auto: 'insurance', date: e.date, updatedAt: new Date().toISOString() });
      else {
        if (S.raw.expenses && S.raw.expenses[id]) ok = await remove('expenses', id);
        if (ok && (String(id).startsWith('gx-') || (e && e.src === 'gcal'))) ok = await exclude([id]);
        if (ok && e) (e.photos || []).forEach(dropPhoto);
      }
    } else {
      const r = S.records.find((x) => x.id === id);
      const linked = gcLinked(r);
      if (b.dataset.cal === '1' && r && r._ev) {
        ok = !!(await removeRec(id, r._ev));
        if (ok) (r.photos || []).forEach(dropPhoto);
        if (ok) { await closeSheet(); toast('앱과 캘린더에서 지웠어요'); } else b.disabled = false;
        return;
      }
      if (S.raw.records && S.raw.records[id]) ok = await remove('records', id);
      if (ok && linked) ok = await exclude([id]);
      if (ok && r) (r.photos || []).forEach(dropPhoto);
    }
    if (ok) { await closeSheet(); toast('지웠어요'); } else b.disabled = false;
  },
  'close-sheet'() { closeSheet(); },
  'edit-pet'(b) { petForm(b.dataset.pet); },
  'edit-feed'(b) { feedForm(b.dataset.pet); },
  'feed-add'() { if (!F || F.kind !== 'feed') return; F.sync(); F.rows.push({ time: '', what: '', how: '' }); F.draw(); },
  'feed-del'(b) { if (!F || F.kind !== 'feed') return; F.sync(); F.rows.splice(Number(b.dataset.i), 1); F.draw(); },
  'edit-ins'() { insForm(); },
  'gc-sync'() { load({ manual: true }); },
  async 'push-mode'(b) {
    const mode = b.dataset.mode;
    if (await patch('info', 'gcal', { push: mode })) toast(mode === 'all' ? '앱에서 적은 기록을 모두 캘린더에 올려요' : mode === 'events' ? '병원·접종 같은 일정만 캘린더에 올려요' : '앱에서 적은 기록은 앱에만 남겨요');
  },
  'set-me'(b) { store.set(ME_STORE, b.dataset.key); render(); toast(`이 폰은 ${famName(b.dataset.key)} 폰으로 기록해요`); },
  'gate-me'(b) { store.set(ME_STORE, b.dataset.key); S.phase = S.raw ? 'live' : 'needkey'; S.tab = 'home'; window.scrollTo(0, 0); render(); toast(`${famName(b.dataset.key)} 폰으로 시작해요`); },
  'code-form'() { codeForm(); },
  'app-howto'() { F = null; openSheet('앱으로 설치하기', `<div class="form">${installSteps()}</div>`); },
  'tip-close'() { tipClosed = true; try { sessionStorage.setItem('ddorong-tip', '1'); } catch { /* 넘어감 */ } render(); },
  logout(b) {
    const slot = $('#logout-slot'); if (!slot) return;
    slot.innerHTML = '<div class="confirm"><span>이 폰에서 비밀번호와 저장된 기록을 지울까요? 다시 들어오려면 비밀번호를 넣어야 해요.</span><button class="btn sm" data-act="logout-yes">나가기</button><button class="btn ghost sm" data-act="logout-no">그대로 두기</button></div>';
  },
  'logout-no'() { const s = $('#logout-slot'); if (s) s.innerHTML = ''; },
  'logout-yes'() {
    store.del(KEY_STORE); store.del(ME_STORE); store.del(CACHE_KEY);
    for (const k of Object.keys(Q)) { clearTimeout(Q[k].timer); delete Q[k]; }
    S.hist = { diary: {}, meds: {}, snacks: {} }; S.dayFrom = '';
    S.raw = null; S.records = []; S.expenses = []; S.pets = {}; S.info = {}; S.events = null;
    S.phase = 'needkey'; S.gateErr = ''; S.tab = 'home'; window.scrollTo(0, 0); render();
  },
  async 'gc-kw-save'() {
    const ta = $('#gc-kw'); if (!ta) return;
    const words = [...new Set(ta.value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean))];
    if (!words.length) { toast('단어를 하나 이상 적어 주세요'); return; }
    if (await patch('info', 'gcal', { keywords: words })) { toast('저장했어요. 이 단어로 다시 불러올게요'); setTimeout(() => load(), 300); }
  },
  async copy(b) {
    const text = b.dataset.text; const what = b.dataset.what || '번호';
    try { await navigator.clipboard.writeText(text); toast(`${what}를 복사했어요`); }
    catch { const s = b.parentElement.querySelector('span'); if (s) { const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast(`${what}를 길게 눌러 복사해 주세요`); }
  },
  'view-photo'(b) {
    const box = b.closest('[data-photos]');
    const ids = box ? [...box.querySelectorAll('[data-act="view-photo"]')].map((x) => x.dataset.id) : [b.dataset.id];
    lbOpen(ids, ids.indexOf(b.dataset.id), box && box.dataset.diary ? box.dataset.diary : '');
  },
  'close-lightbox'() { lbClose(); },
  'add-photo'() {
    if (!canEdit() || !F) return;
    const form = F;
    pickPhotos(async (files) => {
      const box = $('#photo-box'); if (!box) return;
      box.insertAdjacentHTML('beforeend', '<div class="ph busy" id="ph-busy"></div>');
      const ids = await uploadFiles(files);
      if (F !== form) { ids.forEach(dropPhoto); return; }
      F.photos.push(...ids); F.fresh.push(...ids);
      const b2 = $('#photo-box'); if (b2) b2.innerHTML = photoGrid(F.photos, true);
    });
  },
  'drop-photo'(b) {
    if (!F) return; const id = b.dataset.id;
    F.photos = F.photos.filter((x) => x !== id);
    if (F.fresh.includes(id)) { F.fresh = F.fresh.filter((x) => x !== id); dropPhoto(id); } else F.dropped.push(id);
    const box = $('#photo-box'); if (box) box.innerHTML = photoGrid(F.photos, true);
  },
  'pet-photo'(b) {
    if (!canEdit()) return; const pid = b.dataset.pet;
    pickPhotos(async (files) => {
      toast('사진을 올리는 중이에요…');
      const ids = await uploadFiles(files.slice(0, 1)); if (!ids.length) return;
      const old = S.pets[pid]?.photo;
      if (await patch('pets', pid, { photo: ids[0] })) { toast('사진을 바꿨어요'); if (old && old !== ids[0]) dropPhoto(old); }
      else dropPhoto(ids[0]);
    }, false);
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
$('#rec-q').addEventListener('input', (e) => { S.q = e.target.value; renderRecords(); });
/* 날짜 고르기 · 간식 수량 직접 넣기 · 기타 메모 · 한 줄 기록 */
document.addEventListener('change', (e) => {
  const t = e.target;
  if (!t || !t.matches) return;
  if (t.matches('[data-day-input]')) { if (isDate(t.value)) { setDay(t.dataset.dayInput, t.value); render(); } return; }
  if (t.matches('[data-snack]')) {
    const date = curDay('snacks'); const k = t.dataset.snack;
    const cur = Number(dayDoc('snacks', date)[k]) || 0;
    let n = parseInt(String(t.value).replace(/[^\d]/g, ''), 10);
    if (!isFinite(n) || n < 0) n = 0;
    n = Math.min(999, n);
    if (n !== cur) snackChange(date, k, n - cur, n); else t.value = String(cur);
    return;
  }
  if (t.id === 'sn-etc-note') {
    const date = curDay('snacks'); const v = t.value.trim();
    if (v !== String(dayDoc('snacks', date).etcNote || '')) mut('snacks', date, [['set', 'etcNote', v]]);
    return;
  }
  if (t.id === 'd-note') diaryNoteSave();
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Enter' && t && (t.id === 'd-note' || t.id === 'sn-etc-note' || (t.matches && t.matches('[data-snack]')))) { e.preventDefault(); t.blur(); }
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t && t.matches && t.matches('[data-day-input]') && typeof t.showPicker === 'function') { try { t.showPicker(); } catch { /* 폰은 눌러서 바로 열려요 */ } }
});
{
  let sx = null, sy = 0;
  const lbEl = $('#lightbox');
  lbEl.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  lbEl.addEventListener('touchend', (e) => {
    if (sx === null || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) lbGo(dx < 0 ? 1 : -1);
  }, { passive: true });
}
const h0 = (location.hash || '').slice(1); if (TABS.includes(h0)) { S.tab = h0; S.back = h0; }

/* ───────── boot ───────── */
const liveKey = () => !!store.get(KEY_STORE) && !gated();
if (!API_URL) { S.phase = 'error'; S.loadError = 'NO_SERVER'; }
else if (!store.get(KEY_STORE)) S.phase = 'needkey';
else { const cached = loadCache(); if (cached) applyResult(cached, true); }
renderNow();
if (API_URL && store.get(KEY_STORE)) load();
setInterval(() => { if (liveKey() && document.visibilityState === 'visible' && Date.now() - S.loadedAt >= POLL_MS - 1500) load({ soft: true }); }, POLL_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flushAll(); return; }
  if (liveKey() && Date.now() - S.loadedAt > 8000) load({ soft: true });
});
window.addEventListener('pagehide', flushAll);
window.addEventListener('pageshow', (e) => { if (e.persisted && liveKey()) load({ soft: true }); });
window.addEventListener('focus', () => { if (liveKey() && Date.now() - S.loadedAt > 8000) load({ soft: true }); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 앱은 돌아감 */ }); });
}
})();
</script>
</body>
